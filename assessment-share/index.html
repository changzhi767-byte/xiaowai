<style> body{background:var(--bg);font-size:14px}button,input{font:inherit}.preview{min-height:100vh;display:grid;place-content:center;text-align:center;gap:16px;padding:32px}.preview h1{font-size:20px;font-weight:600}.preview p,.preview small{font-size:13px;color:var(--t3);line-height:22px}.preview .btn{justify-self:center;height:32px}.share-dialog{margin:auto;width:507px;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);padding:0;border:0;border-radius:10px;background:#fff;color:var(--t1);box-shadow:0 4px 24px #0000000d,inset 0 0 2px #ffffffe6;overflow:auto}.share-dialog:focus{outline:none}.share-dialog::backdrop{background:rgba(0,0,0,.30)}.share-head{padding:24px}.share-title-row{display:flex;align-items:center;justify-content:space-between}.share-head h2{flex:1;min-width:0;font-size:20px;line-height:28px;font-weight:600}.share-description{font-size:12px;line-height:20px;color:#5e637a;overflow-wrap:anywhere}.share-close{display:grid;place-items:center;flex-shrink:0;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;cursor:pointer}.share-close img{width:24px;height:24px}.share-close:hover{background:var(--bg)}.share-close:active{background:var(--line)}.share-body{padding:0 24px 16px}.share-input{display:block;min-width:0;width:100%;height:40px;padding:2px 8px;background:#fff;color:var(--t1);border:1px solid var(--line);border-radius:10px;line-height:18px;font-size:14px}.share-footer{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.share-expiry{flex:1;font-size:12px;line-height:20px;color:#828386;white-space:nowrap}.share-footer .btn{height:36px;min-width:88px;padding:0 16px;font-size:14px;line-height:18px;flex-shrink:0}.share-footer .btn:disabled{cursor:wait;box-shadow:none;opacity:.6}.share-error{font-size:12px;line-height:18px;color:#f53f3f;margin-top:8px}.share-error[hidden]{display:none}.btn:focus-visible,.share-close:focus-visible{outline:2px solid var(--primary);outline-offset:3px}.share-dialog .tip{position:fixed;z-index:10;top:calc(50% - 150px);max-width:calc(100vw - 32px);white-space:nowrap}.share-input:hover,.share-input:focus,.share-input:focus-visible{border-color:var(--primary);outline:none;box-shadow:none}.share-input::selection{background:#d9e6ff}.preview-footer{position:fixed;bottom:24px;left:24px;color:var(--t3);font-size:12px;pointer-events:none}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>

<body>
<main class="preview">
<h1>分享测评链接</h1>
<p>链接已创建，可重新打开弹窗继续复制分享。</p>

<div class="preview-footer">伴学教练端 / 学习力测评</div>
<dialog class="share-dialog" id="shareDialog" tabindex="-1" aria-labelledby="shareTitle" aria-describedby="shareDescription">
<header class="share-head"><div class="share-title-row"><h2 id="shareTitle">分享测评链接</h2><button class="share-close" id="closeShare" aria-label="关闭弹窗" type="button"><img src="data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJJY29uIj4KPHBhdGggaWQ9IlZlY3RvciIgZD0iTTE4IDZMNiAxOCIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIHN0cm9rZT0iIzFDMUYyRSIvPgo8cGF0aCBpZD0iVmVjdG9yXzIiIGQ9Ik02IDZMMTggMTgiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBzdHJva2U9IiMxQzFGMkUiLz4KPC9nPgo8L3N2Zz4K" alt=""></button></div><p class="share-description" id="shareDescription">已为<span id="studentCount">12</span>位学员创建测评链接，本批学员共用此链接</p></header>
<div class="share-body"><input class="share-input" id="shareLink" aria-label="测评链接（只读）" readonly spellcheck="false" aria-describedby="shareExpiry shareError"><p class="share-error" id="shareError" role="alert" hidden>复制失败，请选中链接手动复制。</p></div>
<footer class="share-footer"><p class="share-expiry" id="shareExpiry"></p><button class="btn btn-primary" id="copyLink" type="button">复制链接</button></footer>

<script>
const versionHistory=[{v:'20261110-05',log:'标题下说明文字改用color/gray/500 #5e637a。'},{v:'20261110-04',log:'输入框hover及聚焦仅原边框变蓝，无外圈；复制按钮高度36px。'},{v:'20261110-03',log:'取消叉号自动聚焦，容器接收焦点；复制提示改为已复制链接；独立GitHub发布。'},{v:'20261110-02',log:'按用户Figma10826:95202还原507×216弹窗和单复制按钮；补复制反馈、失败手动复制、完整长链接及关闭恢复。'},{v:'20261110-01',log:'按真实Figma弹窗和输入框规范组合分享测评链接；只读链接、到期日期、复制反馈和关闭恢复。'}];
// 服务端创建结果的示例；打开/复制不创建链接、不续期、不改测评状态。
const shareResult=Object.freeze({studentCount:12,url:'https://example.com/la/s/demo_7kQ9m2Xp',createdAt:'2026-11-10T10:00:00+08:00',expiresAt:'2026-12-10T10:00:00+08:00'});
const dialog=document.getElementById('shareDialog'),openButton=document.getElementById('openShare'),copyButton=document.getElementById('copyLink'),linkInput=document.getElementById('shareLink'),error=document.getElementById('shareError'),toast=document.getElementById('shareToast');
let session=0,toastTimer,returnFocus=openButton;
linkInput.value=shareResult.url;document.getElementById('studentCount').textContent=shareResult.studentCount;
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(shareResult.expiresAt));const datePart=type=>parts.find(p=>p.type===type).value;
document.getElementById('shareExpiry').textContent='有效期至 '+datePart('year')+'-'+datePart('month')+'-'+datePart('day')+'（30天）';
function clearFeedback(){clearTimeout(toastTimer);toast.classList.remove('show');toast.textContent='';error.hidden=true;copyButton.disabled=false;copyButton.textContent='复制链接'}
function openShare(){returnFocus=document.activeElement instanceof HTMLElement?document.activeElement:openButton;session++;clearFeedback();dialog.showModal();dialog.focus({preventScroll:true})}
function closeShare(){dialog.close()}
dialog.addEventListener('close',()=>{session++;clearFeedback();(returnFocus===document.body?openButton:returnFocus).focus()});
document.getElementById('closeShare').addEventListener('click',closeShare);openButton.addEventListener('click',openShare);
async function copyText(){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(shareResult.url);return}catch{}}linkInput.focus();linkInput.select();if(!document.execCommand('copy'))throw new Error('copy unavailable')}
copyButton.addEventListener('click',async()=>{const ownSession=session;copyButton.disabled=true;copyButton.textContent='复制中';error.hidden=true;try{await copyText();if(!dialog.open||ownSession!==session)return;toast.textContent='已复制链接';toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);copyButton.disabled=false;copyButton.focus()}catch{if(!dialog.open||ownSession!==session)return;error.hidden=false;linkInput.focus();linkInput.select()}finally{if(dialog.open&&ownSession===session){copyButton.disabled=false;copyButton.textContent='复制链接'}}});
openShare();
</script>
