name: Publish complete previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Import reviewed coach runtime once
        run: |
          python3 - <<'PY'
          import hashlib, io, pathlib, zipfile
          root=pathlib.Path('.')
          marker=root/'coach-mistake/.runtime-imported'
          digest='c83ea248bd25e7973b18527387a7719e12b5481a804ac4a382efc5f55a662d82'
          if marker.exists() and marker.read_text().strip()==digest:
              raise SystemExit(0)
          data=b''.join(p.read_bytes() for p in sorted(root.glob('coach-runtime.part*')))
          assert hashlib.sha256(data).hexdigest()==digest, 'Runtime archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for info in archive.infolist():
                  path=pathlib.PurePosixPath(info.filename)
                  assert path.parts[0]=='coach-mistake' and '..' not in path.parts and not path.is_absolute()
              archive.extractall(root)
          marker.write_text(digest+'\n')
          PY
      - name: Apply public demo login defaults
        run: |
          cp coach-login-prefill.js coach-mistake/login-prefill.js
          python3 - <<'PYCODE'
          from pathlib import Path
          base='/xiaowai/coach-mistake/'
          for relative in ['index.html','coach/index.html']:
              p=Path('coach-mistake')/relative
              text=p.read_text().replace('content="20261030-1500"','content="20261030-1510"')
              if relative=='coach/index.html':
                  text=text.replace('</body>','<script src="'+base+'login-prefill.js?v=20261030-1510"></script></body>')
              else:
                  text=text.replace('const versionHistory = [',"const versionHistory = [\n        { v: '20261030-1510', log: '公开演示默认填入可编辑账号密码，不自动登录或勾选协议。' },")
              p.write_text(text)
          PYCODE
      - name: Build independent complete PC demo
        run: |
          python3 - <<'PCBUILD'
          import hashlib, os, pathlib, shutil, subprocess, zipfile
          archive=pathlib.Path('banxue-pc/source-20261102-01.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='b8c3d1dc86f65177cdbb1160b731eeecdcaff0438494ffac76e72b0909e465ef', 'PC source checksum mismatch'
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'pc-complete-source'
          source.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts, 'Invalid source archive path'
              z.extractall(source)
          (source/'verification').mkdir(exist_ok=True)
          patch=pathlib.Path('banxue-pc/trial-20261102-02.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='377c4acc6df93cbdc7432b84224e21553a5d1ab078d49516236f69941bbd96bc', 'Trial badge checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/uploader-20261102-03.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='b3b1a5da5840739880f0c11b00068f4a1cc12e01660a4a5d1c26dac0ac0c9f95', 'Image uploader checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/paste-20261102-04.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='73e30313956d04bfea652b1b6cc283d0e1e36da39c6b7dbc7fc86bbe520e194f', 'Paste state checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/wrong-20261103-01.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='e2f58dc7ce65f8415cfccfd27b6e43cfc859a38dfda0916ab9a8b2f687d811e8', 'Wrong flow checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/visual-20261103-03.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='a0722b8d0f68a0455485c27e36c987902793b9b9e053380dce95b346102238b4', 'Wrong visual checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/cards-20261103-04.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='260106a890f0543e6847bb97a2debb55fbdc5ec7fece4d6039f954ff15586997', 'Business cards checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/reference-20261103-05.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='5684a75ea9fd404ba05faa8fbb3699ab5beb1da907f43c882a8dfd584f0344d6', 'Reference restoration checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/visit-20261103-06.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='0001ca7cc233baaf288f586224c7ea372fcb421513759e92ff28a2da56f3e501', 'Visit restoration checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          patch=pathlib.Path('banxue-pc/unify-20261103-07.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='3cc445d768c5ba0d02aa7efeb4c539c76a834ac299ba13844ef781efd5b24056', 'Unified upload checksum mismatch'
          with zipfile.ZipFile(patch) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(source)
          subprocess.run(['node',str(source/'build.mjs')],check=True)
          subprocess.run(['node',str(source/'verify.mjs')],check=True)
          shutil.copytree(source/'dist/banxue-pc','banxue-pc',dirs_exist_ok=True)
          PCBUILD
      - uses: actions/configure-pages@v5
      - name: Assemble existing and new public previews
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a --exclude='.git' --exclude='.github' --exclude='coach-runtime.part*' --exclude='runtime-sha256.txt' --exclude='coach-login-prefill.js' --exclude='/banxue-pc/source-*.zip' --exclude='/banxue-pc/trial-*.zip' --exclude='/banxue-pc/uploader-*.zip' --exclude='/banxue-pc/paste-*.zip' --exclude='/banxue-pc/wrong-*.zip' --exclude='/banxue-pc/visual-*.zip' --exclude='/banxue-pc/cards-*.zip' --exclude='/banxue-pc/reference-*.zip' --exclude='/banxue-pc/visit-*.zip' --exclude='/banxue-pc/unify-*.zip' ./ "$RUNNER_TEMP/pages/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
